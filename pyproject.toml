[project]
name = "autoace-audio-trial"
version = "0.1.0"
description = "Voice tone and background noise analysis for production call audio"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.13",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    # pyannote 3.x needs the pre-2.9 torchaudio API and pre-1.0 hf-hub auth kwarg
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "silero-vad>=5.1",
    "pyannote.audio>=3.3,<4",
    "huggingface_hub<1.0",
    # funasr pulls transformers 5.x / new speechbrain, both incompatible
    # with the huggingface_hub<1.0 pin that pyannote 3.x requires
    "transformers>=4.50,<5",
    "speechbrain==1.0.0",
    "funasr>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoace_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
