<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoAce Voice Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=9">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="rail-head">
      <h1>AutoAce Voice Analysis</h1>
      <div class="sub">Tone &amp; background-noise evaluation</div>
    </div>
    <div class="rail-list" id="batchList"></div>
    <div class="rail-foot">
      <span class="label">Session</span>
      <button class="btn" id="logout">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M5.5 12.25H2.75a.75.75 0 0 1-.75-.75v-9a.75.75 0 0 1 .75-.75H5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M9 9.75 11.75 7 9 4.25M11.75 7H5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Sign out
      </button>
    </div>
  </aside>

  <main class="main">
    <label class="drop" id="drop">
      <div id="dropIdle">
        <strong>Upload an evaluation batch</strong> — drop a ZIP here or click to browse.
        <div class="hint">Audio files at the root, optionally with a
        <code>name,result_json</code> CSV manifest. The manifest is not required:
        without it every audio file is analyzed, and rows with an empty
        <code>result_json</code> work too. A file that fails is reported alone;
        the batch keeps going.</div>
      </div>
      <div id="dropBusy" class="upload-progress" hidden>
        <div class="row"><span id="upLabel">Uploading…</span><span id="upPct"></span></div>
        <div class="bar" id="upBar"><i style="width:0%"></i></div>
      </div>
      <input type="file" id="fileInput" multiple accept=".zip,.wav,.mp3,.ogg,.flac,.m4a,.csv">
    </label>
    <section id="batchView"><div class="empty">No batch selected yet — upload one to begin.</div></section>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/static/app.js?v=9"></script>
</body>
</html>
